<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="/pE9K3Dp2KboMf3E.js"></script>
  <script src="/ERG8xK1SaIPJWQp.js"></script>
  <script src="/en2LEwtDVZy93N2.js"></script>
  <title>Budweiser AR</title>
</head>

<body style="margin: 0; overflow: auto; background-color: #000000;">
  <script src="/eNSNBxG0MWm0AsX.js" onload="onWasmLoaded()"></script>
  <a-scene>
    <a-light type="ambient" intensity="7.5"></a-light>
    <a-entity simple-ar="src: target.jpg; minCutOffValue: 0.5; betaValue:0.05; dCutOffValue: 0.0001;">
      <a-gltf-model src="url(target.gltf)" scale="4 4 4" position="-0.5 -0.5 0" rotation="0 -90 0"
        material="src:textures/color.png; roughnessMap:textures/roughness.png; metalnessMap:textures/metallic.png; normalMap:textures/normal.png; alphaMap:textures/alpha.png; alphaTest: 0; transparent: false;">
      </a-gltf-model>
    </a-entity>
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
  </a-scene>
</body>

</html>
